name: CDK

# Auth uses GitHub OIDC. Two roles per env, both created by the services stack:
#   - deploy: `geekway-<env>-github-infra-deploy` (output GithubInfraDeployRoleArn)
#       assumed by the push/deploy jobs. Trust pinned to the GitHub Environment
#       context, sub `repo:<repo>:environment:<env>`.
#       NOTE: prod is the only env gated by required reviewers, so its diff is
#       hidden behind the approval gate until you approve. The ungated `diff-prod`
#       job below renders it BEFORE the gate (see that job).
#   - diff:   `geekway-<env>-github-infra-diff`   (output GithubInfraDiffRoleArn)
#       Read-only; assumed by the PR diff job AND the pre-approval `diff-prod` job.
#       Trust accepts two subs: `repo:<repo>:pull_request` and
#       `repo:<repo>:ref:refs/heads/main`. Can't assume any CDK bootstrap role, so
#       it can't deploy even though it now also runs on main pushes.
# Role ARNs are read from secrets (shared convention with the frontends repo):
#   PROD_ROLE_ARN      / NONPROD_ROLE_ARN      -> the deploy role ARNs
#   PROD_DIFF_ROLE_ARN / NONPROD_DIFF_ROLE_ARN -> the diff role ARNs
#
# Secrets can't be referenced in `if:` conditions, so the nonprod skip-guard
# gates on a repo *variable* of the same name, `NONPROD_ROLE_ARN`, used purely as
# an on/off flag. Until a nonprod account exists, leave it unset and the nonprod
# jobs skip themselves. To turn nonprod on in CI, set BOTH:
#   - secret   NONPROD_ROLE_ARN = the geekway-nonprod-github-infra-deploy role ARN
#   - variable NONPROD_ROLE_ARN = any non-empty value (the enable flag)
# The prod deploy is gated by a GitHub Environment named `prod` — configure it
# with required reviewers so deploys pause for manual approval.
#
# First-run note: these roles (and the CDK bootstrap roles) must already exist,
# so the very first bootstrap + deploy of each account is done manually/locally
# (see DEPLOYMENT.md). CI takes over afterward.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: cdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # required to request the OIDC token
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  # ── PR: build + `cdk diff` for both envs (read-only, no approval gate) ──
  # Assumes a dedicated read-only diff role (`geekway-<env>-github-infra-diff`,
  # output GithubInfraDiffRoleArn), NOT the deploy role. That role can't assume any
  # CDK bootstrap role, so a PR — even one that rewrites this workflow — can't
  # deploy. Its trust accepts `sub: …:pull_request` (here) and `…:ref:refs/heads/main`
  # (the diff-prod job), while the deploy role's is pinned to `…:environment:<env>`,
  # so neither read-only context can borrow the deploy role's trust. `--no-change-set`
  # keeps diff read-only (the default changeset diff needs
  # write perms the diff role lacks). The same-repo guard below still blocks forks.
  diff:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [nonprod, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # nonprod leg is skipped until that account exists (NONPROD_ROLE_ARN var unset).
      - name: Configure AWS credentials (${{ matrix.env }})
        if: matrix.env == 'prod' || vars.NONPROD_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Read-only diff role (GithubInfraDiffRoleArn), NOT the deploy role.
          role-to-assume: ${{ matrix.env == 'prod' && secrets.PROD_DIFF_ROLE_ARN || secrets.NONPROD_DIFF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: cdk diff (${{ matrix.env }})
        if: matrix.env == 'prod' || vars.NONPROD_ROLE_ARN != ''
        # --no-change-set keeps diff read-only (the default changeset diff needs
        # write perms the diff role intentionally lacks). Expect a warning that the
        # deploy role can't be assumed — CDK falls back to the diff role's creds.
        run: npx cdk diff --no-change-set --strict --context env=${{ matrix.env }} 2>&1 | tee diff.txt
      - name: Publish diff to job summary
        if: (matrix.env == 'prod' || vars.NONPROD_ROLE_ARN != '') && always()
        run: |
          {
            echo "### cdk diff — ${{ matrix.env }}"
            echo '```'
            cat diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── PR: single stable required check that mirrors the whole diff matrix ──
  # Branch protection can only require checks by exact name, and matrix legs
  # (`diff (prod)`, `diff (nonprod)`) are brittle to pin. This gate collapses the
  # matrix into one name to require. `needs: diff` aggregates every leg into a
  # single `result`; `if: always()` is mandatory so the gate still runs when diff
  # fails (a needs-job is auto-skipped on dependency failure by default, which
  # would deadlock a required check). `skipped` is tolerated so fork PRs — whose
  # diff job is skipped by the same-repo guard above — aren't permanently wedged;
  # `cancelled`/`failure` correctly fail the gate.
  diff-gate:
    if: always() && github.event_name == 'pull_request'
    needs: diff
    runs-on: ubuntu-latest
    steps:
      - name: Require diff success
        run: |
          result="${{ needs.diff.result }}"
          echo "diff matrix aggregated result: $result"
          [[ "$result" == "success" || "$result" == "skipped" ]]

  # ── main: deploy nonprod (gated by the NONPROD_ROLE_ARN flag) ──────────
  # Skips cleanly when no nonprod account exists yet: the NONPROD_ROLE_ARN *var*
  # (enable flag) is unset, so there's nothing to assume (avoids the "Could not
  # load credentials from any providers" failure). Runs once the flag is set and
  # the matching secret is added.
  deploy-nonprod:
    if: github.event_name == 'push' && vars.NONPROD_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: nonprod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.NONPROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # Informational record of what this deploy changes against live nonprod,
      # captured at deploy time. continue-on-error keeps a diff hiccup from
      # blocking the deploy; the deploy role has write perms so a plain diff works.
      - name: cdk diff (nonprod, pre-deploy record)
        continue-on-error: true
        run: npx cdk diff --strict --context env=nonprod 2>&1 | tee diff.txt
      - name: Publish pre-deploy diff to job summary
        if: always()
        run: |
          {
            echo "### cdk diff — nonprod (pre-deploy)"
            echo '```'
            cat diff.txt 2>/dev/null || echo "(no diff captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npx cdk deploy --all --require-approval never --context env=nonprod

  # ── main: render the prod diff BEFORE the approval gate ────────────────
  # deploy-prod sits behind the `prod` Environment's approval gate, so any diff
  # inside it would only run AFTER you approve — too late to inform the decision.
  # This ungated job (no `environment:`) runs first and publishes the diff to its
  # job summary; deploy-prod `needs:` it, so the approval prompt appears only once
  # this diff is ready to read. Uses the read-only diff role (can't deploy); its
  # trust now also accepts the main-branch push sub, so it's assumable here. Every
  # step is continue-on-error so a diff hiccup — or the very first run, before the
  # widened trust has been deployed — can't block the deploy (deploy-prod also runs
  # `if: always()` so it proceeds regardless of this job's outcome).
  diff-prod:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure AWS credentials
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Read-only diff role (GithubInfraDiffRoleArn), NOT the deploy role.
          role-to-assume: ${{ secrets.PROD_DIFF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: cdk diff (prod, pre-approval)
        continue-on-error: true
        # --no-change-set keeps it read-only (the diff role lacks changeset write
        # perms). Expect the benign "can't assume deploy role, proceeding" warning.
        run: npx cdk diff --no-change-set --strict --context env=prod 2>&1 | tee diff.txt
      - name: Publish prod diff to job summary
        if: always()
        run: |
          {
            echo "### cdk diff — prod (pre-approval — read this before approving)"
            echo '```'
            cat diff.txt 2>/dev/null || echo "(no diff captured — see job logs)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── main: deploy prod independently of nonprod, gated by manual approval ─
  # Runs in parallel with deploy-nonprod (no `needs` on it); the `prod`
  # environment's required-reviewers rule is the approval gate. `needs: diff-prod`
  # orders the pre-approval diff first, so the approval prompt only surfaces once
  # that diff is published. `if: always() && …` lets the deploy proceed even if
  # diff-prod failed (e.g. transient npm/AWS hiccup) — the diff is advisory, not a
  # gate. `--require-approval never` only disables CDK's own interactive prompt.
  deploy-prod:
    if: ${{ always() && github.event_name == 'push' }}
    needs: diff-prod
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: npx cdk deploy --all --require-approval never --context env=prod
